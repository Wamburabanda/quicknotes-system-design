<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>QuickNotes</h1>
            <p class="subtitle">Your secure online notepad</p>
        </header>

        <!-- Control Section for Loading Notes -->
        <section class="control-section">
            <button id="load-btn" type="button">Load Notes</button>
        </section>

        <!-- Form Section for Creating Notes -->
        <section class="form-section">
            <form id="note-form">
                <h2>Create a New Note</h2>
                
                <div class="form-group">
                    <label for="title-input">Title (required, max 100 chars):</label>
                    <input type="text" id="title-input" maxlength="100" placeholder="Enter note title..." required>
                </div>

                <div class="form-group">
                    <label for="body-input">Body (optional):</label>
                    <textarea id="body-input" rows="4" placeholder="Write your note content here..."></textarea>
                </div>

                <button id="submit-btn" type="submit">Add Note</button>
            </form>
        </section>

        <!-- Status & Feedback Section -->
        <section class="status-section">
            <p id="status" class="status-idle">Click "Load Notes" to begin.</p>
        </section>

        <!-- Notes Display Section -->
        <section class="list-section">
            <h2>Your Notes</h2>
            <ul id="notes-list">
                <li class="empty-state">No notes loaded yet.</li>
            </ul>
        </section>
    </div>
</body>
</html>
